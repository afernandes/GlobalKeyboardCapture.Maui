name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore tests
        run: dotnet restore GlobalKeyboardCapture.Maui.Tests/GlobalKeyboardCapture.Maui.Tests.csproj

      - name: Build tests
        run: dotnet build GlobalKeyboardCapture.Maui.Tests/GlobalKeyboardCapture.Maui.Tests.csproj -c Release --no-restore

      - name: Run tests
        run: dotnet test --project GlobalKeyboardCapture.Maui.Tests/GlobalKeyboardCapture.Maui.Tests.csproj -c Release --no-build -- --report-xunit-trx --report-xunit-trx-filename test-results.trx

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'

  build-platform:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            workload: maui-android
            tfm: net10.0-android
            sample_runtime_args: ''
          - name: Windows
            os: windows-latest
            workload: maui-windows
            tfm: net10.0-windows10.0.19041.0
            sample_runtime_args: ''
          - name: iOS
            os: macos-26
            workload: maui-ios
            tfm: net10.0-ios
            sample_runtime_args: -r iossimulator-arm64
          - name: Mac Catalyst
            os: macos-26
            workload: maui-maccatalyst
            tfm: net10.0-maccatalyst
            sample_runtime_args: -r maccatalyst-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install platform workload
        run: dotnet workload install ${{ matrix.workload }} --ignore-failed-sources

      - name: Build library
        run: dotnet build GlobalKeyboardCapture.Maui/GlobalKeyboardCapture.Maui.csproj -c Release -f ${{ matrix.tfm }} -p:TargetFrameworks=${{ matrix.tfm }}

      - name: Build sample
        run: dotnet build GlobalKeyboardCapture.Maui.Sample/GlobalKeyboardCapture.Maui.Sample.csproj -c Release -f ${{ matrix.tfm }} ${{ matrix.sample_runtime_args }} -p:TargetFrameworks=${{ matrix.tfm }}

  android-integration:
    name: Android key integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '8.13'

      - name: Install Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Build Android sample APK
        run: dotnet build GlobalKeyboardCapture.Maui.Sample/GlobalKeyboardCapture.Maui.Sample.csproj -c Release -f net10.0-android -r android-x64 -p:TargetFrameworks=net10.0-android -p:AndroidPackageFormat=apk -p:RunAOTCompilation=false

      - name: Build Android UI Automator test APK
        run: gradle -p eng/android-device-tests :app:assembleDebugAndroidTest --no-daemon

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Inject Android keyboard events
        uses: reactivecircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          enable-hw-keyboard: true
          script: |
            adb install -r "$(find GlobalKeyboardCapture.Maui.Sample/bin/Release/net10.0-android -name '*-Signed.apk' -print -quit)"
            adb install -r eng/android-device-tests/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb logcat -c
            adb shell am instrument -w -r -e class io.github.afernandes.globalkeyboardcapture.devicetests.KeyboardCaptureDeviceTest com.companyname.globalkeyboardcapturemauisample.test/androidx.test.runner.AndroidJUnitRunner | tee android-device-test.txt
            grep -F 'OK (1 test)' android-device-test.txt
            adb shell monkey -p com.companyname.globalkeyboardcapturemauisample 1
            timeout 60 sh -c 'until adb logcat -d -s GKC.Integration:I "*:S" | grep -F "Ready;Views=1"; do sleep 1; done'
            timeout 30 sh -c 'until adb logcat -d -s GKC.Integration:I "*:S" | grep -F "Focused"; do sleep 1; done'
            adb shell input keyboard keyevent 131
            adb shell input keyboard keyevent 142
            adb shell input keyboard keyevent 160
            sleep 2
            adb logcat -d -v brief > android-keyboard.log
            grep -F 'Key=F1;NativeKeyCode=131' android-keyboard.log
            grep -F 'Key=F12;NativeKeyCode=142' android-keyboard.log
            grep -F 'Key=Enter;NativeKeyCode=160;Location=Numpad' android-keyboard.log

      - name: Upload Android integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-keyboard-log
          path: |
            android-keyboard.log
            android-device-test.txt

  windows-integration:
    name: Windows runtime integration
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Windows workload
        run: dotnet workload install maui-windows --ignore-failed-sources

      - name: Build unpackaged sample
        run: dotnet build GlobalKeyboardCapture.Maui.Sample/GlobalKeyboardCapture.Maui.Sample.csproj -c Release -f net10.0-windows10.0.19041.0 -p:TargetFrameworks=net10.0-windows10.0.19041.0 -p:WindowsRuntimeIntegrationBuild=true

      - name: Exercise WinUI keyboard and global-hotkey runtime
        shell: pwsh
        run: |
          $env:GKC_WINDOWS_INTEGRATION = '1'
          $env:GKC_WINDOWS_INTEGRATION_OUTPUT = Join-Path $env:RUNNER_TEMP 'windows-keyboard-integration.log'
          $executable = Get-ChildItem GlobalKeyboardCapture.Maui.Sample/bin/Release/net10.0-windows10.0.19041.0/win-x64 -Filter GlobalKeyboardCapture.Maui.Sample.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          $process = Start-Process -FilePath $executable -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill($true)
            if (Test-Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT) {
              Get-Content $env:GKC_WINDOWS_INTEGRATION_OUTPUT
            }
            throw 'Windows integration app timed out.'
          }
          if (Test-Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT) {
            Get-Content $env:GKC_WINDOWS_INTEGRATION_OUTPUT
          }
          if ($process.ExitCode -ne 0) {
            throw "Windows integration app exited with code $($process.ExitCode)."
          }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^PASS KeyDownKeyUp$' -Quiet | ForEach-Object { if (-not $_) { throw 'KeyDown/KeyUp evidence missing.' } }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^PASS TwoWindows$' -Quiet | ForEach-Object { if (-not $_) { throw 'Two-window evidence missing.' } }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^PASS ContentReplacement$' -Quiet | ForEach-Object { if (-not $_) { throw 'Content replacement evidence missing.' } }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^PASS AttachDetach$' -Quiet | ForEach-Object { if (-not $_) { throw 'Attach/detach evidence missing.' } }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^PASS RegisterHotKeyUnregisterHotKeyWmHotkey$' -Quiet | ForEach-Object { if (-not $_) { throw 'Global hotkey evidence missing.' } }
          Select-String -Path $env:GKC_WINDOWS_INTEGRATION_OUTPUT -Pattern '^RESULT PASS$' -Quiet | ForEach-Object { if (-not $_) { throw 'Windows integration did not pass.' } }

      - name: Upload Windows integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-keyboard-log
          path: ${{ runner.temp }}/windows-keyboard-integration.log

  pack:
    name: Pack NuGet
    runs-on: windows-latest
    needs: [test, build-platform, android-integration, windows-integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workloads
        run: dotnet workload install maui --ignore-failed-sources

      - name: Detect published API baseline
        id: api-baseline
        shell: pwsh
        run: |
          $baseline = dotnet msbuild GlobalKeyboardCapture.Maui/GlobalKeyboardCapture.Maui.csproj -nologo -getProperty:PublicApiBaselineVersion
          $uri = "https://api.nuget.org/v3-flatcontainer/globalkeyboardcapture.maui/$baseline/globalkeyboardcapture.maui.$baseline.nupkg"
          try {
            Invoke-WebRequest -Uri $uri -Method Head -UseBasicParsing | Out-Null
            "available=true" >> $env:GITHUB_OUTPUT
            "version=$baseline" >> $env:GITHUB_OUTPUT
          }
          catch {
            "available=false" >> $env:GITHUB_OUTPUT
            "Package baseline $baseline is not published yet; structural package validation remains enabled."
          }

      - name: Pack library with published API baseline
        if: steps.api-baseline.outputs.available == 'true'
        run: dotnet pack GlobalKeyboardCapture.Maui/GlobalKeyboardCapture.Maui.csproj -c Release -p:UsePublishedApiBaseline=true

      - name: Pack library before initial 2.x baseline
        if: steps.api-baseline.outputs.available != 'true'
        run: dotnet pack GlobalKeyboardCapture.Maui/GlobalKeyboardCapture.Maui.csproj -c Release

      - name: Upload NuGet package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nupkg
          path: |
            GlobalKeyboardCapture.Maui/bin/Release/*.nupkg
            GlobalKeyboardCapture.Maui/bin/Release/*.snupkg

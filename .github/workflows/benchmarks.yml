name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: Keyboard hot-path benchmarks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore benchmarks
        run: dotnet restore GlobalKeyboardCapture.Maui.Benchmarks/GlobalKeyboardCapture.Maui.Benchmarks.csproj

      - name: Run short benchmark suite
        run: dotnet run --project GlobalKeyboardCapture.Maui.Benchmarks/GlobalKeyboardCapture.Maui.Benchmarks.csproj -c Release --no-restore -- --filter '*' --job short --exporters json markdown

      - name: Validate benchmark policy
        shell: pwsh
        run: ./eng/benchmarks/Validate-BenchmarkResults.ps1

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts
